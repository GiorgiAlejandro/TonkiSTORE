<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TonkiSTORE — Panel de administración</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="css/styles.css" />
        <link rel="stylesheet" href="css/admin.css" />
    </head>

    <body>
        <!-- ─── Header ──────────────────────────────────────────────────── -->
        <header class="header">
            <div class="header__inner">
                <a href="index.html" class="logo">
                    <div class="logo__icon"></div>
                    <span class="logo__text">TONKI<span>STORE</span></span>
                </a>
                <nav class="header__nav" style="margin-left: auto">
                    <a href="index.html" class="btn-auth btn-auth--outline">← Volver al sitio</a>
                </nav>
            </div>
        </header>

        <!-- ─── Admin form ──────────────────────────────────────────────── -->
        <div class="admin-page">
            <div class="admin-page__heading">
                <p class="admin-page__label">// Administración</p>
                <h1 class="admin-page__title">Agregar producto</h1>
            </div>

            <div id="formMsg" class="form-msg"></div>

            <!-- nombre -->
            <div class="form-group">
                <label for="fieldName">Nombre del producto</label>
                <input type="text" id="fieldName" placeholder="Ej: Elden Ring" autocomplete="off" />
            </div>

            <!-- descripción -->
            <div class="form-group">
                <label for="fieldDesc">Descripción</label>
                <textarea id="fieldDesc" rows="1" placeholder="Descripción detallada del producto..."></textarea>
            </div>

            <!-- precio y precio original en la misma fila -->
            <div class="form-row">
                <div class="form-group">
                    <label for="fieldPrice">Precio (USD)</label>
                    <input type="number" id="fieldPrice" min="0" step="0.01" placeholder="29.99" />
                </div>
                <div class="form-group">
                    <label for="fieldOriginal">Precio original</label>
                    <input type="number" id="fieldOriginal" min="0" step="0.01" placeholder="49.99" />
                </div>
            </div>

            <!-- géneros -->
            <div class="form-group">
                <label for="fieldTags">Géneros (separados por coma)</label>
                <input type="text" id="fieldTags" placeholder="RPG, Acción, Indie" />
            </div>

            <!-- fecha -->
            <div class="form-group">
                <label for="fieldRelease">Fecha de lanzamiento</label>
                <input type="text" id="fieldRelease" placeholder="15 ene 2026" />
            </div>

            <!-- imágenes -->
            <div class="form-group">
                <label>Imágenes</label>
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fieldImages" accept="image/*" multiple />
                    <p class="upload-area__label">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="17 8 12 3 7 8" />
                            <line x1="12" y1="3" x2="12" y2="15" />
                        </svg>
                        <span>Elegí archivos</span> o arrastrá acá — PNG, JPG, WEBP
                    </p>
                </div>
                <div class="image-previews" id="imagePreviews"></div>
            </div>

            <button class="btn-submit" id="submitBtn" type="button">Guardar producto</button>
        </div>

        <!-- ─── Footer ──────────────────────────────────────────────────── -->
        <footer class="footer">
            <div class="footer__inner">
                <span class="footer__copy">© 2026 TonkiSTORE. Todos los derechos reservados.</span>
            </div>
        </footer>

        <script src="js/data.js"></script>
        <script src="js/admin.js"></script>
    </body>
</html>
